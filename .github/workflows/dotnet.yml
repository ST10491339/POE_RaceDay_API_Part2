
name: POE RaceDay API CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore POE_RaceDay_API.sln

      - name: Build Solution
        run: dotnet build POE_RaceDay_API.sln --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test POE_RaceDay_API.sln --configuration Release --no-build --logger "console;verbosity=normal"
